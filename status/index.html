<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamTrace — In Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0a1a33;
      --bg: #0f2747;
      --blue: #1e4d8c;
      --blue-mid: #2a6bb8;
      --blue-bright: #4da3ff;
      --blue-soft: #9ec9ff;
      --blue-pale: #c7e0ff;
      --border: rgba(77, 163, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--blue-pale);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77, 163, 255, 0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(30, 77, 140, 0.5), transparent),
        linear-gradient(160deg, var(--bg-deep), var(--bg) 45%, #132f55);
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }

    .card {
      width: min(520px, 100%);
      background: linear-gradient(180deg, rgba(30, 77, 140, 0.55), rgba(15, 39, 71, 0.85));
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(157, 201, 255, 0.08) inset,
        0 24px 60px rgba(0, 20, 50, 0.45);
      backdrop-filter: blur(10px);
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue-bright);
      margin-bottom: 1.25rem;
    }

    .pulse::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue-bright);
      box-shadow: 0 0 0 0 rgba(77, 163, 255, 0.7);
      animation: ping 1.6s ease-out infinite;
    }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(77, 163, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(77, 163, 255, 0); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--blue-pale);
      margin-bottom: 0.35rem;
    }

    h1 span {
      color: var(--blue-bright);
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--blue-soft);
      margin-bottom: 1.75rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue-mid), transparent);
      margin: 0 0 1.75rem;
    }

    .joke-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue-bright);
      margin-bottom: 0.75rem;
    }

    #joke {
      min-height: 5.5rem;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--blue-pale);
      margin-bottom: 1.5rem;
      display: grid;
      place-items: center;
    }

    #joke .placeholder {
      color: var(--blue-soft);
      opacity: 0.7;
      font-style: italic;
    }

    button {
      appearance: none;
      border: 2px solid var(--blue-bright);
      background: var(--blue);
      color: var(--blue-pale);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 24px rgba(30, 77, 140, 0.5);
    }

    button:hover {
      background: var(--blue-mid);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(77, 163, 255, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 1.75rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--blue-soft);
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="pulse">Build status</div>
    <h1>ScamTrace <span>—</span></h1>
    <p class="subtitle">In Progress</p>
    <div class="divider"></div>

    <p class="joke-label">// deploy-time entertainment</p>
    <div id="joke">
      <span class="placeholder">Press the button. Get a joke. Ship later.</span>
    </div>
    <button type="button" id="jokeBtn">Deploy a Joke</button>
    <p class="footer">blue on blue · jokes on us · production soon™</p>
  </main>

  <script>
    const jokes = [
      "Why do programmers prefer dark mode? Because light attracts bugs.",
      "A SQL query walks into a bar, walks up to two tables and asks: 'Can I join you?'",
      "There are only 10 kinds of people: those who understand binary and those who don't.",
      "I would tell you a UDP joke, but you might not get it.",
      "My code doesn't have bugs — it just develops unexpected features.",
      "Git commit -m 'fix' — famous last words before production.",
      "How many programmers does it take to change a light bulb? None. That's a hardware problem.",
      "I changed my password to 'incorrect' so when I forget it, the computer says 'Your password is incorrect.'",
      "A Jedi rejects OOP: 'May the force be with you' — no classes, only the Force.",
      "We don't deploy on Fridays. We deploy on Thursdays and debug over the weekend.",
      "404: Motivation not found.",
      "I told my computer I needed a break… it said 'Error 418: I'm a teapot.'",
      "Debugging: being the detective in a crime movie where you are also the murderer.",
      "Knock knock. Who's there? Recursion. Recursion who? Knock knock.",
      "The best thing about a Boolean is even if you're wrong, you're only off by a bit.",
      "ScamTrace tip: if the joke takes 3 seconds to load, blame CDN… or me.",
      "In Progress means: works on my machine, fails in production, ships anyway.",
      "Why did the developer go broke? Because he used up all his cache.",
      "npm install happiness — ERR! peer dependency hell",
      "Real programmers count from 0. Real deadlines count from yesterday.",
    ];

    const jokeEl = document.getElementById("joke");
    const btn = document.getElementById("jokeBtn");
    let last = -1;

    btn.addEventListener("click", () => {
      let i = Math.floor(Math.random() * jokes.length);
      if (jokes.length > 1 && i === last) i = (i + 1) % jokes.length;
      last = i;
      jokeEl.textContent = jokes[i];
      btn.textContent = "Deploy Another Joke";
    });
  </script>
</body>
</html>
